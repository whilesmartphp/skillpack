name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: whilesmart/workflows/package/release@80342872d815ec6906a537b652dc1f212ea66d5a
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: whilesmart/skillpack
